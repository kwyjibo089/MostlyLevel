name: esp32

# No path filters: `tests` is a required check on main, and a filtered-out
# workflow never reports it, which would block pull requests that only touch
# other folders (hardware/, mobile/).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: esp32

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: esp32/requirements-dev.txt

      - name: Install tools
        run: python -m pip install -r requirements-dev.txt

      - name: ruff, mpy-cross, pytest
        run: tools/test.sh

      - name: Upload differing reference images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actual
          path: esp32/tests/golden/_actual/
          if-no-files-found: ignore

  build:
    name: build
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: esp32/requirements-dev.txt

      - name: Install tools
        run: python -m pip install -r requirements-dev.txt

      - name: Build .mpy bundle
        run: tools/build_mpy.sh

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: mostlylevel-mpy-${{ github.sha }}
          path: esp32/build/mpy/
          if-no-files-found: error
